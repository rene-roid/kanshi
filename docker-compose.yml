services:
  kanshi:
    # Pulls the published image. `docker compose up -d --build` builds it from
    # this checkout instead.
    image: ghcr.io/rene-roid/kanshi:${KANSHI_VERSION:-latest}
    build: .
    container_name: kanshi
    restart: unless-stopped

    # Host networking for two reasons: /proc/net/dev is namespaced, so it is the
    # only way to report real host network throughput, and it lets Kanshi listen
    # on the host's own LAN and Tailscale addresses.
    network_mode: host

    environment:
      # Who can open the dashboard. localhost always works; add lan, tailscale
      # (comma-separated), or all. Empty means local only.
      KANSHI_ACCESS: "${KANSHI_ACCESS:-}"
      # The older way to say the same thing, still honoured if set.
      KANSHI_HOST: "${KANSHI_HOST:-}"
      KANSHI_PORT: "${KANSHI_PORT:-8100}"

      # Live poll cadence. Each tick is one /containers/json plus one /stats per
      # running container, so keep this conservative.
      KANSHI_POLL_INTERVAL: "${KANSHI_POLL_INTERVAL:-5}"
      KANSHI_DOCKER_CONCURRENCY: "${KANSHI_DOCKER_CONCURRENCY:-8}"
      # Polling stops entirely once no browser has been connected this long.
      KANSHI_IDLE_TIMEOUT: "${KANSHI_IDLE_TIMEOUT:-30}"

      # Storage map. "auto" is the host's / plus every drive mounted under /mnt.
      KANSHI_STORAGE_ROOTS: "${KANSHI_STORAGE_ROOTS:-auto}"
      # A cached folder size older than this many seconds is measured again
      # the next time the folder around it is opened.
      KANSHI_STORAGE_INTERVAL: "${KANSHI_STORAGE_INTERVAL:-21600}"
      # Host paths to skip. /var/lib/docker is ~100k overlay2 files and
      # dominates the walk time — set it here to trim the walk.
      KANSHI_STORAGE_EXCLUDE: "${KANSHI_STORAGE_EXCLUDE:-}"
      # Share of one core, in percent, the walk may average. 100 = unthrottled.
      KANSHI_STORAGE_CPU: "${KANSHI_STORAGE_CPU:-25}"
      KANSHI_TREE_DEPTH: "${KANSHI_TREE_DEPTH:-4}"

      # Give the GC a budget below mem_limit so a walk on an unusually large
      # filesystem degrades into more collection rather than an OOM kill.
      GOMEMLIMIT: "80MiB"
      # Two Ps is plenty for a 5s poll loop and one walk, and it keeps the Go
      # scheduler from spreading across all four cores of a busy box.
      GOMAXPROCS: "2"

    volumes:
      # Read-only on the socket is a mount flag, not an API restriction — it is
      # the access mode above that keeps this out of reach.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The whole host, read-only. rslave lets a drive mounted under /mnt after
      # the container started show up here too, without a restart.
      - /:/hostfs:ro,rslave
      # The folder size cache, so a restart or an update does not walk the
      # disk again.
      - kanshi-data:/data

    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    # Read/traverse bypass only — it does NOT grant write bypass (that would be
    # DAC_OVERRIDE). Without it the walk cannot enter home directories (0750)
    # and silently under-reports the root filesystem.
    cap_add: [DAC_READ_SEARCH]
    security_opt:
      - no-new-privileges:true

    # Stays out of the way of everything else on a small box. Steady state is
    # ~0.03% of one core; the ceiling is headroom for the walk.
    cpus: "1.0"
    # Measured peak during a full walk of a 2 TB host is ~20 MiB of heap, and
    # ~8 MiB at rest. The rest of this is reclaimable page cache the walk pulls
    # in, which the kernel drops again the moment anything else wants it.
    mem_limit: 96m

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  kanshi-data:
